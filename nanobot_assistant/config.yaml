name: "Nanobot Assistant"
description: "Ultra-lightweight AI personal assistant for Home Assistant powered by Zhipu GLM / OpenRouter / Anthropic and other LLM providers. MCP support, Telegram integration, scheduled tasks."
version: "0.1.13"
slug: "nanobot_assistant"
url: "https://github.com/HKUDS/nanobot"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
host_network: true
map:
  - addon_config:rw
  - homeassistant_config:rw
  - ssl:ro
ports:
  18790/tcp: 18790
  8080/tcp: 8080
ports_description:
  18790/tcp: "Nanobot Gateway"
  8080/tcp: "Web UI (chat, settings, logs)"
options:
  llm:
    provider: "zhipu"
    api_key: ""
    model: "zai/glm-4-flash"
    api_base: "https://open.bigmodel.cn/api/coding/paas/v4"
  telegram:
    enabled: false
    token: ""
    allow_from: []
  homeassistant_mcp:
    enabled: true
    url: "http://localhost:8123/api/mcp"
    token: ""
  advanced:
    system_prompt: ""
    ha_config_access: false
    timezone: "Europe/Kiev"
    max_tokens: 8192
    temperature: 0.7
schema:
  llm:
    provider: "str"
    api_key: "password"
    model: "str"
    api_base: "url?"
  telegram:
    enabled: "bool"
    token: "password?"
    allow_from:
      - "str"
  homeassistant_mcp:
    enabled: "bool"
    url: "url?"
    token: "password?"
  advanced:
    system_prompt: "str?"
    ha_config_access: "bool"
    timezone: "str?"
    max_tokens: "int?"
    temperature: "float?"
panel_icon: "mdi:robot-happy"
panel_title: "Nanobot"
ingress: true
ingress_port: 8080
ingress_stream: true
