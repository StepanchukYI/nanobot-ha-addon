name: "Nanobot — AI Assistant for Raspberry Pi"
description: "Ultra-lightweight AI assistant (~100 MB RAM) built for Raspberry Pi and low-power devices. Multi-provider LLM support (Zhipu, OpenRouter, OpenAI, Anthropic, DeepSeek, Gemini, Ollama). MCP tools, Telegram bot, Exchange calendar, scheduled tasks."
version: "0.1.28"
slug: "nanobot_assistant"
url: "https://github.com/HKUDS/nanobot"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
host_network: true
map:
  - addon_config:rw
  - homeassistant_config:rw
  - ssl:ro
ports:
  18790/tcp: 18790
  8080/tcp: 8080
ports_description:
  18790/tcp: "Nanobot Gateway"
  8080/tcp: "Web UI (chat, settings, logs)"
options:
  CONFIG_PATH: "/config/nanobot"
  DATA_PATH: "/data/nanobot"
  ha_config_access: false
  timezone: "Europe/Kiev"
schema:
  CONFIG_PATH: "str"
  DATA_PATH: "str"
  ha_config_access: "bool"
  timezone: "str?"
panel_icon: "mdi:robot-happy"
panel_title: "Nanobot"
ingress: true
ingress_port: 8080
ingress_stream: true
